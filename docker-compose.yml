services:
  postgres:
    image: postgres:16-alpine
    container_name: bichopet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bichopet
      POSTGRES_USER: bichopet
      POSTGRES_PASSWORD: bichopet_local
    ports:
      - "5434:5432"
    volumes:
      - bichopet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bichopet -d bichopet"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bichopet_postgres_data:
