services:
  postgres:
    image: postgres:16-alpine
    container_name: erp-comercial-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp_comercial
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_comercial"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
